name: mtforum
description: MT论坛第三方客户端
publish_to: 'none'
version: 2.51.1+180

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  shared_preferences: ^2.3.3
  html: ^0.15.4
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  photo_view: ^0.15.0
  file_picker: ^8.1.7
  path_provider: ^2.1.5

  qr_flutter: ^4.1.0

  image_picker: ^1.1.2

  image: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# shared_preferences_android 2.5.0 改走 JNI，release 包里方法被 R8 裁掉，启动即白屏。
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag
    - shaders/liquid_glass_image.frag
